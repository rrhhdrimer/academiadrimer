<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia Drimer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EEF0EF;
    --card: #FFFFFF;
    --ink: #14203A;
    --ink-soft: #4B5670;
    --gold: #B8933F;
    --gold-soft: #E4D6B0;
    --rust: #9C4A38;
    --rust-bg: #F6E7E3;
    --line: #DADDDA;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(184,147,63,0.10), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(20,32,58,0.06), transparent 40%);
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 20px 48px;
  }

  /* ---------- Marca / ruta ---------- */
  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:28px;
    max-width:420px;
    width:100%;
  }
  .seal{
    width:44px; height:44px;
    border-radius:50%;
    border:1.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:14px;
    background:var(--card);
  }
  .seal svg{ width:20px; height:20px; }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:-0.01em;
    margin:0 0 4px;
    text-align:center;
  }
  .subtitle{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    margin:0 0 24px;
  }
  /* ---------- Card de login ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:30px 26px 26px;
    width:100%;
    max-width:400px;
    box-shadow:0 1px 2px rgba(20,32,58,0.04), 0 12px 32px -16px rgba(20,32,58,0.18);
  }
  .field{ margin-bottom:16px; }
  label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
    letter-spacing:0.01em;
  }
  input{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:9px;
    font-size:16px;
    font-family:'IBM Plex Mono', monospace;
    background:#FBFBFA;
    color:var(--ink);
    transition:border-color .15s ease, background .15s ease;
  }
  input:focus{
    outline:none;
    border-color:var(--gold);
    background:#fff;
  }
  .btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:9px;
    background:var(--ink);
    color:#fff;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:14.5px;
    letter-spacing:0.01em;
    cursor:pointer;
    margin-top:6px;
    transition:background .15s ease, transform .05s ease;
  }
  .btn:hover{ background:#1D2C4E; }
  .btn:active{ transform:scale(0.99); }
  .btn:disabled{ background:#9AA1B2; cursor:not-allowed; }

  .helper{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:18px;
    line-height:1.5;
  }
  .helper .link{
    color:var(--gold);
    font-weight:600;
    text-decoration:none;
    border-bottom:1px solid var(--gold);
  }
  .helper .link:hover{ opacity:0.8; }

  .error{
    display:none;
    background:var(--rust-bg);
    color:var(--rust);
    border:1px solid rgba(156,74,56,0.25);
    border-radius:8px;
    padding:10px 12px;
    font-size:13px;
    margin-bottom:16px;
  }
  .error.show{ display:block; }

  /* Foco visible para accesibilidad / navegación por teclado */
  a:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

  <div class="brand">
    <div class="seal" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#B8933F" stroke-width="1.6">
        <path d="M12 3l7 3.5v5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5v-5L12 3z"/>
        <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Academia Drimer</h1>
    <p class="subtitle">Plataforma virtual de aprendizaje</p>
  </div>

  <form class="card" id="loginForm" novalidate>
    <div class="error" id="errorBox" role="alert"></div>

    <div class="field">
      <label for="dni">DNI</label>
      <input type="text" id="dni" inputmode="numeric" autocomplete="username" placeholder="12345678" required maxlength="15">
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn" id="btnSubmit">Ingresar</button>

    <p class="helper">¿Olvidaste tu contraseña?<br><a href="reset.html" class="link">Haz clic aquí para crear una nueva</a>.</p>
  </form>

<script>
  // URL del backend (Apps Script Web App)
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwpGBl5tnCjLjjeAqdjIjHpPB6s0dy5379MHedP1pN5uOcYIrUhpn1wMall2Thhh8Psyg/exec';

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const btn = document.getElementById('btnSubmit');

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
  function hideError(){
    errorBox.classList.remove('show');
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    hideError();

    const dni = document.getElementById('dni').value.trim();
    const password = document.getElementById('password').value.trim();

    if(!dni || !password){
      showError('Completa tu DNI y contraseña.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Ingresando...';

    try{
      // OJO: usamos text/plain para evitar problemas de CORS con Apps Script.
      // El backend igual lee e.postData.contents como JSON.
      const res = await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login', dni: dni, password: password })
      });
      const data = await res.json();

      if(data.ok){
        sessionStorage.setItem('rdi_dni', data.dni);
        sessionStorage.setItem('rdi_nombre', data.nombre);
        sessionStorage.setItem('rdi_rol', data.rol);
        sessionStorage.setItem('rdi_puesto', data.puesto || '');
        sessionStorage.setItem('rdi_area', data.area || '');
        sessionStorage.setItem('rdi_gerencia', data.gerencia || '');
        // Próximo paso: redirigir a dashboard.html (aún no construido)
        window.location.href = 'dashboard.html';
      } else {
        showError(data.mensaje || 'No se pudo iniciar sesión.');
      }
    } catch(err){
      showError('No pudimos conectar con el servidor. Intenta nuevamente.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Ingresar';
    }
  });
</script>

</body>
</html>
