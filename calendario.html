<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario — Academia Drimer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EEF0EF;
    --card: #FFFFFF;
    --ink: #14203A;
    --ink-soft: #4B5670;
    --gold: #B8933F;
    --gold-soft: #E4D6B0;
    --green: #3E6957;
    --green-bg: #E6EEE9;
    --rust: #9C4A38;
    --rust-bg: #F6E7E3;
    --blue: #2C5FA8;
    --blue-bg: #DCE3F0;
    --line: #DADDDA;
    --sidebar-w: 232px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    font-family:'Poppins', sans-serif;
    color:var(--ink);
  }
  a{ text-decoration:none; color:inherit; }

  /* ============================================================
     SHELL: sidebar (PC) + topbar con hamburguesa (celular)
     ============================================================ */
  .app-shell{ display:flex; min-height:100vh; }

  .sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:var(--ink);
    color:#fff;
    display:flex;
    flex-direction:column;
    position:fixed;
    top:0; left:0; bottom:0;
    transform:translateX(-100%);
    transition:transform .25s ease;
    z-index:40;
  }
  .sidebar.open{ transform:translateX(0); }
  @media (min-width:860px){ .sidebar{ position:sticky; transform:none; } }

  .sidebar-brand{
    display:flex; align-items:center; gap:10px;
    padding:20px 20px 18px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .seal{
    width:30px; height:30px; border-radius:50%;
    border:1.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .seal svg{ width:14px; height:14px; }
  .sidebar-brand span{ font-family:'Poppins', sans-serif; font-weight:600; font-size:15.5px; }

  .sidebar-user{ padding:16px 20px; border-bottom:1px solid rgba(255,255,255,0.08); }
  .sidebar-user .name{ font-size:13.5px; font-weight:600; }
  .sidebar-user .role{
    font-family:'Poppins', sans-serif; font-size:10px; color:var(--gold);
    text-transform:uppercase; letter-spacing:0.04em; margin-top:2px;
  }

  .sidebar-nav{ flex:1; padding:14px 12px; display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:11px 12px; border-radius:8px;
    font-size:13.5px; font-weight:500; color:rgba(255,255,255,0.75);
    cursor:pointer;
  }
  .nav-item svg{ width:17px; height:17px; flex-shrink:0; }
  .nav-item:hover{ background:rgba(255,255,255,0.06); color:#fff; }
  .nav-item.active{ background:rgba(184,147,63,0.18); color:#fff; }
  .nav-item.active svg{ stroke:var(--gold); }
  .nav-item.disabled{ cursor:default; color:rgba(255,255,255,0.32); }
  .nav-item.disabled:hover{ background:none; color:rgba(255,255,255,0.32); }
  .nav-item .soon{
    margin-left:auto; font-family:'Poppins', sans-serif; font-size:8.5px;
    background:rgba(255,255,255,0.08); padding:2px 6px; border-radius:10px; letter-spacing:0.03em;
  }
  .nav-item .nav-badge{
    margin-left:auto;
    background:var(--rust);
    color:#fff;
    font-size:10px;
    font-weight:700;
    min-width:17px;
    height:17px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    padding:0 5px;
  }

  .sidebar-footer{ padding:14px 20px 18px; border-top:1px solid rgba(255,255,255,0.08); }
  .logout{
    width:100%; background:none; border:1px solid rgba(255,255,255,0.2); color:#fff;
    font-size:12px; font-family:'Poppins', sans-serif; padding:9px; border-radius:7px; cursor:pointer;
  }
  .logout:hover{ background:rgba(255,255,255,0.08); }

  .overlay{ display:none; position:fixed; inset:0; background:rgba(20,32,58,0.45); z-index:30; }
  .overlay.show{ display:block; }
  .hidden{ display:none !important; }

  .main-area{ flex:1; min-width:0; }

  .topbar{
    display:flex; align-items:center; gap:12px;
    background:var(--ink); color:#fff; padding:16px 18px;
  }
  @media (min-width:860px){ .topbar{ display:none; } }
  .hamburger{ background:none; border:none; color:#fff; font-size:20px; cursor:pointer; line-height:1; padding:2px 4px; }
  .topbar-title{ font-family:'Poppins', sans-serif; font-weight:600; font-size:15px; }

  main{ max-width:640px; margin:0 auto; padding:28px 18px 60px; }

  .greeting h2{ font-family:'Poppins', sans-serif; font-weight:600; font-size:22px; margin:0 0 4px; }
  .greeting p{ color:var(--ink-soft); font-size:13.5px; margin:0 0 20px; }

  /* ---------- Calendario ---------- */
  .cal-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px; margin-bottom:20px;
  }
  .cal-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
  }
  .cal-header .mes{
    font-family:'Poppins', sans-serif; font-weight:600; font-size:16px;
    text-transform:capitalize;
  }
  .cal-nav{
    background:none; border:none; cursor:pointer;
    color:var(--ink-soft); width:30px; height:30px;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
  }
  .cal-nav:hover{ background:var(--paper); color:var(--ink); }
  .cal-nav svg{ width:16px; height:16px; }

  .cal-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:3px; }
  .cal-dow{
    text-align:center; font-size:10.5px; font-weight:700; color:var(--ink-soft);
    text-transform:uppercase; padding-bottom:6px;
  }
  .cal-day{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:500; color:var(--ink); border-radius:8px;
    position:relative;
  }
  .cal-day.muted{ color:#C6CAD1; }
  .cal-day.today{ background:var(--ink); color:#fff; font-weight:700; }
  .cal-day.in-range:not(.today){ font-weight:600; }
  .cal-day .range-fill{
    position:absolute; inset:2px; border-radius:6px; z-index:0;
  }
  .cal-day span{ position:relative; z-index:1; }
  .cal-day.today span{ z-index:1; }

  /* ---------- Leyenda ---------- */
  .legend-title{
    font-family:'Poppins', sans-serif; font-size:11px; font-weight:600;
    letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-soft);
    margin:0 0 10px;
  }
  .legend-item{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:13px 16px; display:flex; align-items:center; gap:12px; margin-bottom:8px;
  }
  .legend-dot{ width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  .legend-info{ flex:1; min-width:0; }
  .legend-name{ font-weight:600; font-size:13.5px; }
  .legend-dates{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
  .legend-tag{
    font-family:'Poppins', sans-serif; font-size:9.5px; font-weight:700;
    padding:3px 9px; border-radius:20px; flex-shrink:0; text-transform:uppercase; letter-spacing:0.02em;
  }

  .empty, .loading, .error-box{ text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 0; }
  .error-box{ color:var(--rust); }
</style>
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="seal" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#B8933F" stroke-width="1.6">
          <path d="M12 3l7 3.5v5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5v-5L12 3z"/>
          <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span>Academia Drimer</span>
    </div>

    <div class="sidebar-user">
      <div class="name" id="sidebarNombre">—</div>
      <div class="role" id="sidebarRol">—</div>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Cursos
      </a>
      <a class="nav-item active" href="calendario.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Calendario
      </a>
      <a class="nav-item" href="mensajes.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Mensajes
        <span class="nav-badge hidden" id="navBadgeMensajes">0</span>
      </a>
      <a class="nav-item" href="calificaciones.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Calificaciones
      </a>
      <a class="nav-item" href="certificados.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="5"/><path d="M8.5 12.5L7 22l5-3 5 3-1.5-9.5"/></svg>
        Certificados
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout" id="btnLogout">Cerrar sesión</button>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <div class="main-area">
    <header class="topbar">
      <button class="hamburger" id="btnHamburger" aria-label="Abrir menú">☰</button>
      <span class="topbar-title">Academia Drimer</span>
    </header>

    <main>
      <div class="greeting">
        <h2>Calendario</h2>
        <p>Fechas de tus cursos y programas activos.</p>
      </div>

      <div class="cal-card">
        <div class="cal-header">
          <button class="cal-nav" id="btnMesAnterior" aria-label="Mes anterior">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <span class="mes" id="mesActual">—</span>
          <button class="cal-nav" id="btnMesSiguiente" aria-label="Mes siguiente">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
        <div class="cal-grid" id="calGrid">
          <div class="loading">Cargando calendario...</div>
        </div>
      </div>

      <p class="legend-title">Tus cursos y programas</p>
      <div id="legendList">
        <div class="loading">Cargando...</div>
      </div>
    </main>
  </div>

</div>

<script>
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwpGBl5tnCjLjjeAqdjIjHpPB6s0dy5379MHedP1pN5uOcYIrUhpn1wMall2Thhh8Psyg/exec';

  const dni = sessionStorage.getItem('rdi_dni');
  const nombre = sessionStorage.getItem('rdi_nombre');
  const rol = sessionStorage.getItem('rdi_rol');

  if(!dni){ window.location.href = 'login.html'; }

  document.getElementById('sidebarNombre').textContent = nombre || '—';
  document.getElementById('sidebarRol').textContent = rol || 'estudiante';

  document.getElementById('btnLogout').addEventListener('click', function(){
    sessionStorage.clear();
    window.location.href = 'login.html';
  });

  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  document.getElementById('btnHamburger').addEventListener('click', function(){
    sidebar.classList.add('open'); overlay.classList.add('show');
  });
  overlay.addEventListener('click', function(){
    sidebar.classList.remove('open'); overlay.classList.remove('show');
  });

  async function actualizarBadgeMensajes(){
    if(rol !== 'admin' && rol !== 'profesor') return;
    try{
      const res = await fetch(WEB_APP_URL + '?action=getBandejaAdmin');
      const bandeja = await res.json();
      const totalNoLeidos = bandeja.reduce(function(sum, c){ return sum + (c.noLeidos || 0); }, 0);
      const badge = document.getElementById('navBadgeMensajes');
      if(totalNoLeidos > 0){
        badge.textContent = totalNoLeidos > 9 ? '9+' : totalNoLeidos;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    } catch(err){ /* silencioso */ }
  }
  actualizarBadgeMensajes();

  // ============================================================
  // CALENDARIO
  // ============================================================
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const DOW = ['lu','ma','mi','ju','vi','sá','do'];
  const COLORES = [
    { bg:'#F3E7C9', text:'#8A6A1E', dot:'var(--gold)' },
    { bg:'#DCEAE3', text:'#2F6152', dot:'var(--green)' },
    { bg:'#DCE3F0', text:'#2C5FA8', dot:'var(--blue)' }
  ];

  let mesVisible = new Date();
  mesVisible.setDate(1);
  let grupos = []; // { nombre, inicio, fin, tipo, color }

  function soloFecha(d){
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  async function initCalendario(){
    try{
      const res = await fetch(WEB_APP_URL + '?action=getCursos');
      const cursos = await res.json();
      grupos = agruparPorPrograma(cursos);
      renderLeyenda();
      renderCalendario();
    } catch(err){
      document.getElementById('calGrid').innerHTML = '<div class="error-box">No pudimos cargar el calendario.</div>';
    }
  }

  function agruparPorPrograma(cursos){
    const mapa = {};
    const sueltos = [];

    cursos.forEach(function(c){
      if(!c.fechaInicio || !c.fechaFin) return; // sin fechas cargadas, no aparece en el calendario

      if(c.ruta){
        if(!mapa[c.ruta]){
          mapa[c.ruta] = { nombre: c.ruta, inicio: c.fechaInicio, fin: c.fechaFin, tipo: 'Programa' };
        }
      } else {
        sueltos.push({ nombre: c.nombre, inicio: c.fechaInicio, fin: c.fechaFin, tipo: 'Curso suelto' });
      }
    });

    const resultado = Object.values(mapa).concat(sueltos);
    resultado.forEach(function(g, i){ g.color = COLORES[i % COLORES.length]; });
    return resultado;
  }

  function renderLeyenda(){
    const cont = document.getElementById('legendList');
    if(!grupos.length){
      cont.innerHTML = '<div class="empty">No tienes cursos con fechas programadas todavía.</div>';
      return;
    }
    cont.innerHTML = '';
    grupos.forEach(function(g){
      const inicio = new Date(g.inicio);
      const fin = new Date(g.fin);
      const opciones = { day:'2-digit', month:'short' };
      const row = document.createElement('div');
      row.className = 'legend-item';
      row.innerHTML =
        '<span class="legend-dot" style="background:' + g.color.dot + '"></span>' +
        '<div class="legend-info">' +
          '<div class="legend-name">' + g.nombre + '</div>' +
          '<div class="legend-dates">' + inicio.toLocaleDateString('es-PE', opciones) + ' — ' + fin.toLocaleDateString('es-PE', opciones) + '</div>' +
        '</div>' +
        '<span class="legend-tag" style="background:' + g.color.bg + '; color:' + g.color.text + '">' + g.tipo + '</span>';
      cont.appendChild(row);
    });
  }

  function renderCalendario(){
    const year = mesVisible.getFullYear();
    const month = mesVisible.getMonth();
    document.getElementById('mesActual').textContent = MESES[month] + ' ' + year;

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    DOW.forEach(function(d){
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    const primerDia = new Date(year, month, 1);
    const ultimoDia = new Date(year, month + 1, 0);
    const offsetInicio = (primerDia.getDay() + 6) % 7; // lunes = 0
    const diasEnMes = ultimoDia.getDate();
    const hoy = soloFecha(new Date());

    // Días del mes anterior (relleno)
    for(let i = offsetInicio; i > 0; i--){
      const d = new Date(year, month, 1 - i);
      grid.appendChild(crearCelda(d, true, hoy));
    }
    // Días del mes actual
    for(let d = 1; d <= diasEnMes; d++){
      const fecha = new Date(year, month, d);
      grid.appendChild(crearCelda(fecha, false, hoy));
    }
    // Relleno final hasta completar semana
    const totalCeldas = offsetInicio + diasEnMes;
    const sobran = (7 - (totalCeldas % 7)) % 7;
    for(let i = 1; i <= sobran; i++){
      const d = new Date(year, month + 1, i);
      grid.appendChild(crearCelda(d, true, hoy));
    }
  }

  function crearCelda(fecha, esOtroMes, hoy){
    const celda = document.createElement('div');
    celda.className = 'cal-day' + (esOtroMes ? ' muted' : '');

    const esHoy = soloFecha(fecha).getTime() === hoy.getTime();
    if(esHoy) celda.classList.add('today');

    // Buscar si cae dentro de algún grupo
    const fechaTs = soloFecha(fecha).getTime();
    const grupoMatch = grupos.find(function(g){
      const ini = soloFecha(new Date(g.inicio)).getTime();
      const fin = soloFecha(new Date(g.fin)).getTime();
      return fechaTs >= ini && fechaTs <= fin;
    });

    if(grupoMatch && !esOtroMes){
      celda.classList.add('in-range');
      const fill = document.createElement('div');
      fill.className = 'range-fill';
      fill.style.background = grupoMatch.color.bg;
      if(!esHoy) celda.style.color = grupoMatch.color.text;
      celda.appendChild(fill);
      celda.title = grupoMatch.nombre;
    }

    const span = document.createElement('span');
    span.textContent = fecha.getDate();
    celda.appendChild(span);

    return celda;
  }

  document.getElementById('btnMesAnterior').addEventListener('click', function(){
    mesVisible.setMonth(mesVisible.getMonth() - 1);
    renderCalendario();
  });
  document.getElementById('btnMesSiguiente').addEventListener('click', function(){
    mesVisible.setMonth(mesVisible.getMonth() + 1);
    renderCalendario();
  });

  initCalendario();
</script>

</body>
</html>
