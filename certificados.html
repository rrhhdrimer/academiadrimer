<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificados — Academia Drimer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EEF0EF;
    --card: #FFFFFF;
    --ink: #14203A;
    --ink-soft: #4B5670;
    --gold: #B8933F;
    --gold-vivid: #D9A61F;
    --gold-soft: #E4D6B0;
    --green: #3E6957;
    --green-bg: #E6EEE9;
    --rust: #9C4A38;
    --rust-bg: #F6E7E3;
    --line: #DADDDA;
    --sidebar-w: 244px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    font-family:'Poppins', sans-serif;
    color:var(--ink);
  }
  a{ text-decoration:none; color:inherit; }

  /* ============================================================
     SHELL: sidebar (PC) + topbar con hamburguesa (celular)
     — idéntico a calificaciones.html —
     ============================================================ */
  .app-shell{ display:flex; min-height:100vh; }

  .sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:var(--ink);
    color:#fff;
    display:flex;
    flex-direction:column;
    position:fixed;
    top:0; left:0; bottom:0;
    transform:translateX(-100%);
    transition:transform .25s ease;
    z-index:40;
  }
  .sidebar.open{ transform:translateX(0); }
  @media (min-width:860px){
    .sidebar{ position:sticky; transform:none; }
  }

  .sidebar-brand{
    display:flex; align-items:center; gap:10px;
    padding:20px 20px 18px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .seal{
    width:30px; height:30px;
    border-radius:50%;
    border:1.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .seal svg{ width:14px; height:14px; }
  .sidebar-brand span{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:15.5px;
  }
  .brand-icon{ width:61.5px; height:auto; flex-shrink:0; display:block; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text .brand-line1{ font-family:'Poppins', sans-serif; font-weight:400; font-size:20.25px; color:#fff; }
  .brand-text .brand-line2{ font-family:'Poppins', sans-serif; font-weight:700; font-size:25.5px; color:#fff; margin-top:-2px; }

  .sidebar-user{
    padding:16px 20px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .sidebar-user .name{ font-size:13.5px; font-weight:600; line-height:1.35; word-break:break-word; }
  .sidebar-user .role{
    font-family:'Poppins', sans-serif;
    font-size:10px;
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin-top:2px;
  }

  .sidebar-nav{ flex:1; padding:14px 12px; display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:11px 12px;
    border-radius:8px;
    font-size:13.5px;
    font-weight:500;
    color:rgba(255,255,255,0.75);
    cursor:pointer;
  }
  .nav-item svg{ width:17px; height:17px; flex-shrink:0; }
  .nav-item:hover{ background:rgba(255,255,255,0.06); color:#fff; }
  .nav-item.active{ background:rgba(184,147,63,0.18); color:#fff; }
  .nav-item.active svg{ stroke:var(--gold); }
  .nav-item.disabled{ cursor:default; color:rgba(255,255,255,0.32); }
  .nav-item.disabled:hover{ background:none; color:rgba(255,255,255,0.32); }
  .nav-item .soon{
    margin-left:auto;
    font-family:'Poppins', sans-serif;
    font-size:8.5px;
    background:rgba(255,255,255,0.08);
    padding:2px 6px;
    border-radius:10px;
    letter-spacing:0.03em;
  }

  .nav-item .nav-badge{
    margin-left:auto;
    background:var(--rust);
    color:#fff;
    font-size:10px;
    font-weight:700;
    min-width:17px;
    height:17px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    padding:0 5px;
  }

  .sidebar-footer{ padding:14px 20px 18px; border-top:1px solid rgba(255,255,255,0.08); }
  .logout{
    width:100%;
    background:none;
    border:1px solid rgba(255,255,255,0.2);
    color:#fff;
    font-size:12px;
    font-family:'Poppins', sans-serif;
    padding:9px;
    border-radius:7px;
    cursor:pointer;
  }
  .logout:hover{ background:rgba(255,255,255,0.08); }

  .overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(20,32,58,0.45);
    z-index:30;
  }
  .overlay.show{ display:block; }
  .hidden{ display:none !important; }

  .main-area{ flex:1; min-width:0; }

  .topbar{
    display:flex; align-items:center; gap:12px;
    background:var(--ink);
    color:#fff;
    padding:16px 18px;
  }
  @media (min-width:860px){ .topbar{ display:none; } }
  .hamburger{
    background:none; border:none; color:#fff;
    font-size:20px; cursor:pointer; line-height:1;
    padding:2px 4px;
  }
  .topbar-title{ font-family:'Poppins', sans-serif; font-weight:600; font-size:15px; }

  main{
    max-width:760px;
    margin:0 auto;
    padding:28px 18px 60px;
  }

  .greeting h2{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 4px;
  }
  .greeting p{
    color:var(--ink-soft);
    font-size:13.5px;
    margin:0 0 22px;
  }

  /* ---------- Resumen general (2 columnas: este menú no tiene "desaprobado") ---------- */
  .summary-row{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:10px;
    margin-bottom:22px;
  }
  .summary-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 10px;
    text-align:center;
  }
  .summary-card .num{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:22px;
    color:var(--ink);
  }
  .summary-card .lbl{
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  /* ---------- Etiqueta de ruta/programa ---------- */
  .route-tag{
    display:inline-block;
    font-family:'Poppins', sans-serif;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.03em;
    color:var(--gold-vivid);
    text-transform:uppercase;
    margin-top:4px;
  }

  /* ---------- Lista de certificados ---------- */
  .cert-list{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .cert-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .cert-row:last-child{ border-bottom:none; }
  .cert-row .info{ flex:1; min-width:0; }
  .cert-row .code{
    font-family:'Poppins', sans-serif;
    font-size:10px;
    color:var(--ink-soft);
  }
  .cert-row .name{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:14.5px;
    margin-top:1px;
    line-height:1.3;
  }
  .cert-row .right{
    text-align:right;
    flex-shrink:0;
  }

  .btn-descargar{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--ink);
    color:var(--gold-vivid);
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:12px;
    padding:9px 14px;
    border-radius:7px;
    white-space:nowrap;
  }
  .btn-descargar:hover{ background:#1c2c4d; }
  .btn-descargar svg{ width:13px; height:13px; }

  .locked{
    display:flex;
    align-items:center;
    gap:6px;
    justify-content:flex-end;
    color:var(--ink-soft);
    font-size:11px;
    max-width:150px;
    text-align:right;
    line-height:1.4;
  }
  .locked svg{ width:14px; height:14px; flex-shrink:0; }

  .loading, .error-box{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:40px 0;
  }
  .error-box{ color:var(--rust); }
</style>
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="assets/logo-academia-icon-blanco.png" alt="" class="brand-icon" aria-hidden="true">
      <div class="brand-text">
        <span class="brand-line1">Academia</span>
        <span class="brand-line2">Drimer</span>
      </div>
    </div>

    <div class="sidebar-user">
      <div class="name" id="sidebarNombre">—</div>
      <div class="role" id="sidebarRol">—</div>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Cursos
      </a>
      <a class="nav-item" href="calendario.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Calendario
      </a>
      <a class="nav-item" href="mensajes.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Mensajes
        <span class="nav-badge hidden" id="navBadgeMensajes">0</span>
      </a>
      <a class="nav-item" href="calificaciones.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Calificaciones
      </a>
      <a class="nav-item active" href="certificados.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="5"/><path d="M8.5 12.5L7 22l5-3 5 3-1.5-9.5"/></svg>
        Certificados
      </a>
      <a class="nav-item hidden" href="dashboard.html?vista=gestion" id="navGestion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Gestión académica
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout" id="btnLogout">Cerrar sesión</button>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <div class="main-area">
    <header class="topbar">
      <button class="hamburger" id="btnHamburger" aria-label="Abrir menú">☰</button>
      <span class="topbar-title">Academia Drimer</span>
    </header>

    <main>
      <div class="greeting">
        <h2>Certificados</h2>
        <p>Descarga el certificado de cada curso que hayas aprobado.</p>
      </div>

      <div class="summary-row" id="summaryRow"></div>

      <div class="cert-list" id="certList">
        <div class="loading">Cargando certificados...</div>
      </div>
    </main>
  </div>

</div>

<script>
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwpGBl5tnCjLjjeAqdjIjHpPB6s0dy5379MHedP1pN5uOcYIrUhpn1wMall2Thhh8Psyg/exec';

  const dni = sessionStorage.getItem('rdi_dni');
  const nombre = sessionStorage.getItem('rdi_nombre');
  const rol = sessionStorage.getItem('rdi_rol');

  if(!dni){
    window.location.href = 'login.html';
  }

  document.getElementById('sidebarNombre').textContent = nombre || '—';
  document.getElementById('sidebarRol').textContent = rol || 'estudiante';

  if(rol === 'admin'){
    document.getElementById('navGestion').classList.remove('hidden');
  }

  document.getElementById('btnLogout').addEventListener('click', function(){
    sessionStorage.clear();
    window.location.href = 'login.html';
  });

  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  document.getElementById('btnHamburger').addEventListener('click', function(){
    sidebar.classList.add('open');
    overlay.classList.add('show');
  });
  overlay.addEventListener('click', function(){
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  });

  async function actualizarBadgeMensajes(){
    if(rol !== 'admin' && rol !== 'profesor') return;
    try{
      const res = await fetch(WEB_APP_URL + '?action=getBandejaAdmin');
      const bandeja = await res.json();
      const totalNoLeidos = bandeja.reduce(function(sum, c){ return sum + (c.noLeidos || 0); }, 0);
      const badge = document.getElementById('navBadgeMensajes');
      if(totalNoLeidos > 0){
        badge.textContent = totalNoLeidos > 9 ? '9+' : totalNoLeidos;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    } catch(err){ /* silencioso */ }
  }
  actualizarBadgeMensajes();

  const ICONO_CANDADO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/></svg>';
  const ICONO_DESCARGA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>';

  async function cargarCertificados(){
    try{
      const [resCursos, resEstado] = await Promise.all([
        fetch(WEB_APP_URL + '?action=getCursos'),
        fetch(WEB_APP_URL + '?action=getEstadoUsuario&dni=' + encodeURIComponent(dni))
      ]);
      const cursos = await resCursos.json();
      const estado = await resEstado.json();

      renderResumen(cursos, estado);
      renderLista(cursos, estado);
    } catch(err){
      document.getElementById('certList').innerHTML =
        '<div class="error-box">No pudimos cargar tus certificados. Recarga la página.</div>';
    }
  }

  function renderResumen(cursos, estado){
    let disponibles = 0, pendientes = 0;
    cursos.forEach(function(c){
      const e = estado[c.codigo] ? estado[c.codigo].estado : 'Pendiente';
      if(e === 'Aprobado') disponibles++;
      else pendientes++;
    });

    const summary = document.getElementById('summaryRow');
    summary.innerHTML =
      '<div class="summary-card"><div class="num" style="color:var(--green)">' + disponibles + '</div><div class="lbl">Disponibles</div></div>' +
      '<div class="summary-card"><div class="num" style="color:var(--ink-soft)">' + pendientes + '</div><div class="lbl">Pendientes</div></div>';
  }

  function renderLista(cursos, estado){
    const lista = document.getElementById('certList');
    lista.innerHTML = '';

    cursos.forEach(function(curso){
      const info = estado[curso.codigo];
      const aprobado = info && info.estado === 'Aprobado';

      const row = document.createElement('div');
      row.className = 'cert-row';

      const rightHtml = aprobado
        ? '<a class="btn-descargar" href="certificado.html?curso=' + encodeURIComponent(curso.codigo) + '">' +
            ICONO_DESCARGA + ' Descargar' +
          '</a>'
        : '<div class="locked">' + ICONO_CANDADO + ' Se desbloquea al aprobar el examen</div>';

      row.innerHTML =
        '<div class="info">' +
          '<div class="code">' + curso.codigo + '</div>' +
          '<div class="name">' + curso.nombre + '</div>' +
          (curso.ruta ? '<div class="route-tag">' + curso.ruta + '</div>' : '') +
        '</div>' +
        '<div class="right">' + rightHtml + '</div>';

      lista.appendChild(row);
    });
  }

  cargarCertificados();
</script>

</body>
</html>
