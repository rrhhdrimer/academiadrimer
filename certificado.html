<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificado — Academia Drimer</title>
<script src="assets/js/jspdf.umd.min.js"></script>
<style>
  /* Fuentes auto-hospedadas (assets/fonts/) — no dependen de Google Fonts.
     Un canvas necesita la fuente 100% cargada antes del primer dibujo
     (no hay "parpadeo" tolerable como en texto HTML normal), así que
     preferimos no depender de la latencia de un CDN externo para esto. */
  @font-face{
    font-family:'Pinyon Script';
    src:url('assets/fonts/PinyonScript.woff2') format('woff2');
    font-weight:400; font-style:normal; font-display:block;
  }
  @font-face{
    font-family:'Poppins';
    src:url('assets/fonts/Poppins-Regular.woff2') format('woff2');
    font-weight:400; font-style:normal; font-display:block;
  }
  @font-face{
    font-family:'Poppins';
    src:url('assets/fonts/Poppins-SemiBold.woff2') format('woff2');
    font-weight:600; font-style:normal; font-display:block;
  }
  @font-face{
    font-family:'Poppins';
    src:url('assets/fonts/Poppins-Bold.woff2') format('woff2');
    font-weight:700; font-style:normal; font-display:block;
  }

  :root{
    --ink:#14203A;
    --ink-soft:#4B5670;
    --gold:#B8933F;
    --paper:#EEF0EF;
    --card:#FFFFFF;
    --line:#DADDDA;
    --rust:#9C4A38;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  a{ text-decoration:none; color:inherit; }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--ink);
    color:#fff;
    padding:16px 20px;
  }
  .volver{
    display:flex; align-items:center; gap:6px;
    font-size:13px; font-weight:500;
    color:rgba(255,255,255,0.85);
  }
  .volver svg{ width:16px; height:16px; }
  .volver:hover{ color:#fff; }
  .brand{ font-weight:600; font-size:14.5px; }
  .brand-logo{ height:24px; width:auto; display:block; }

  main{
    max-width:900px;
    margin:0 auto;
    padding:24px 16px 60px;
  }

  .estado-box{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .estado-box.error{ color:var(--rust); }
  .estado-box a{
    display:inline-block;
    margin-top:16px;
    color:var(--ink);
    font-weight:600;
    text-decoration:underline;
  }

  .preview-wrap{
    display:none;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
  }
  .preview-wrap.show{ display:block; }
  #certCanvas{
    width:100%;
    height:auto;
    display:block;
    border-radius:4px;
    border:1px solid #E2E8F0;
  }

  .acciones{
    text-align:center;
    margin-top:18px;
  }
  #btnDescargar{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:14px;
    background:var(--ink);
    color:var(--gold);
    border:none;
    border-radius:8px;
    padding:13px 26px;
    cursor:pointer;
  }
  #btnDescargar:hover{ background:#1c2c4d; }
</style>
</head>
<body>

<header>
  <a class="volver" href="certificados.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Certificados
  </a>
  <img src="assets/logo-academia-blancas.png" alt="Academia Drimer" class="brand-logo">
</header>

<main>
  <div class="estado-box" id="estadoBox">Cargando tu certificado…</div>

  <div class="preview-wrap" id="previewWrap">
    <canvas id="certCanvas" width="2000" height="1414"></canvas>
  </div>

  <div class="acciones" id="acciones" style="display:none">
    <button id="btnDescargar">Descargar PDF</button>
  </div>
</main>

<script>
/* =======================================================================
   MOTOR DE CERTIFICADO — coordenadas medidas a pixel exacto sobre la
   plantilla real (2000x1414). No tocar sin volver a medir la plantilla.
   ======================================================================= */

const LIENZO = { w: 2000, h: 1414 };

const NOMBRE_CFG = {
  fontFamily: "'Pinyon Script', cursive",
  maxSize: 150,
  minSize: 40,
  baselineY: 716,
  maxWidth: 1450,
  color: '#1A1720',
  centerX: 1000
};

const PARRAFO_CFG = {
  fontFamily: "'Poppins', sans-serif",
  size: 33,
  minSize: 24,
  lineHeight: 50,
  baseY: 830,
  maxLines: 3,
  maxWidth: 1482,
  color: '#1A1720',
  centerX: 1000,
  prefijo: 'Por haber completado satisfactoriamente el curso ',
  sufijo: ' como parte de la Ruta Drimer Íntegro, acreditando el cumplimiento de los contenidos y la evaluación correspondiente.'
};

const FECHA_CFG = {
  fontFamily: "'Poppins', sans-serif",
  weight: '600',
  size: 30,
  letterSpacing: 2,
  baselineY: 1338,
  color: '#1A1720',
  centerX: 1000
};

const MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO',
  'AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];

function formatearFechaLarga(valor){
  let d;
  if(valor instanceof Date){
    d = valor;
  } else {
    const [y,m,day] = valor.split('-').map(Number);
    d = new Date(y, m-1, day);
  }
  return `${d.getDate()} DE ${MESES[d.getMonth()]} DEL ${d.getFullYear()}`;
}

function medirTamañoAjustado(ctx, texto, cfg){
  let size = cfg.maxSize;
  ctx.font = `${size}px ${cfg.fontFamily}`;
  while(ctx.measureText(texto).width > cfg.maxWidth && size > cfg.minSize){
    size -= 2;
    ctx.font = `${size}px ${cfg.fontFamily}`;
  }
  return size;
}

function dibujarNombre(ctx, nombre){
  const cfg = NOMBRE_CFG;
  const size = medirTamañoAjustado(ctx, nombre, cfg);
  ctx.font = `${size}px ${cfg.fontFamily}`;
  ctx.fillStyle = cfg.color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(nombre, cfg.centerX, cfg.baselineY);
}

function armarParrafo(ctx, nombreCurso, cfg){
  const tokens = [];
  cfg.prefijo.trim().split(' ').forEach(w => tokens.push({text:w, bold:false}));
  nombreCurso.trim().split(' ').forEach(w => tokens.push({text:w, bold:true}));
  cfg.sufijo.trim().split(' ').forEach(w => tokens.push({text:w, bold:false}));

  let size = cfg.size;

  function envolverConTamaño(fontSize){
    const fontReg = `400 ${fontSize}px ${cfg.fontFamily}`;
    const fontBold = `700 ${fontSize}px ${cfg.fontFamily}`;
    ctx.font = fontReg;
    const spaceW = ctx.measureText(' ').width;

    const lines = [];
    let cur = [];
    let curW = 0;

    tokens.forEach(tok => {
      ctx.font = tok.bold ? fontBold : fontReg;
      const w = ctx.measureText(tok.text).width;
      const add = cur.length ? w + spaceW : w;
      if(cur.length && curW + add > cfg.maxWidth){
        lines.push({tokens: cur, width: curW});
        cur = [{...tok, width: w}];
        curW = w;
      } else {
        cur.push({...tok, width: w});
        curW += add;
      }
    });
    if(cur.length) lines.push({tokens: cur, width: curW});
    return lines;
  }

  let lines = envolverConTamaño(size);
  while(lines.length > cfg.maxLines && size > cfg.minSize){
    size -= 1;
    lines = envolverConTamaño(size);
  }
  return { lines, size };
}

function dibujarParrafo(ctx, nombreCurso){
  const cfg = PARRAFO_CFG;
  const { lines, size } = armarParrafo(ctx, nombreCurso, cfg);
  const fontReg = `400 ${size}px ${cfg.fontFamily}`;
  const fontBold = `700 ${size}px ${cfg.fontFamily}`;
  const spaceW = (() => { ctx.font = fontReg; return ctx.measureText(' ').width; })();

  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = cfg.color;

  lines.forEach((line, i) => {
    let x = cfg.centerX - line.width/2;
    const y = cfg.baseY + i*cfg.lineHeight;
    line.tokens.forEach(tok => {
      ctx.font = tok.bold ? fontBold : fontReg;
      ctx.textAlign = 'left';
      ctx.fillText(tok.text, x, y);
      x += tok.width + spaceW;
    });
  });
}

function dibujarFecha(ctx, textoFecha){
  const cfg = FECHA_CFG;
  ctx.font = `${cfg.weight} ${cfg.size}px ${cfg.fontFamily}`;
  ctx.fillStyle = cfg.color;
  ctx.textBaseline = 'alphabetic';

  const letras = textoFecha.split('');
  let totalW = 0;
  letras.forEach((ch,i) => {
    totalW += ctx.measureText(ch).width;
    if(i < letras.length-1) totalW += cfg.letterSpacing;
  });

  ctx.textAlign = 'left';
  let x = cfg.centerX - totalW/2;
  letras.forEach(ch => {
    ctx.fillText(ch, x, cfg.baselineY);
    x += ctx.measureText(ch).width + cfg.letterSpacing;
  });
}

function cargarImagen(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

let plantillaImg = null;
let fuentesListas = false;

async function asegurarFuentesCargadas(){
  if(fuentesListas) return;
  await Promise.all([
    document.fonts.load(`${NOMBRE_CFG.maxSize}px ${NOMBRE_CFG.fontFamily}`),
    document.fonts.load(`400 ${PARRAFO_CFG.size}px ${PARRAFO_CFG.fontFamily}`),
    document.fonts.load(`700 ${PARRAFO_CFG.size}px ${PARRAFO_CFG.fontFamily}`),
    document.fonts.load(`${FECHA_CFG.weight} ${FECHA_CFG.size}px ${FECHA_CFG.fontFamily}`)
  ]);
  await document.fonts.ready;
  fuentesListas = true;
}

async function renderCertificado(ctx, { nombre, curso, fechaTexto }){
  await asegurarFuentesCargadas();
  if(!plantillaImg){
    plantillaImg = await cargarImagen('assets/certificado-plantilla.png');
  }
  ctx.clearRect(0,0,LIENZO.w,LIENZO.h);
  ctx.drawImage(plantillaImg, 0, 0, LIENZO.w, LIENZO.h);
  dibujarNombre(ctx, nombre);
  dibujarParrafo(ctx, curso);
  dibujarFecha(ctx, fechaTexto);
}

/* ============================ Flujo real ============================ */

const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwpGBl5tnCjLjjeAqdjIjHpPB6s0dy5379MHedP1pN5uOcYIrUhpn1wMall2Thhh8Psyg/exec';

const dni = sessionStorage.getItem('rdi_dni');
if(!dni){
  window.location.href = 'login.html';
}

const params = new URLSearchParams(window.location.search);
const codigoCurso = params.get('curso');

const estadoBox = document.getElementById('estadoBox');
const previewWrap = document.getElementById('previewWrap');
const acciones = document.getElementById('acciones');
const canvas = document.getElementById('certCanvas');
const ctx = canvas.getContext('2d');

let datosActuales = null;

function mostrarError(mensaje){
  estadoBox.className = 'estado-box error';
  estadoBox.innerHTML = mensaje + '<br><a href="certificados.html">Volver a certificados</a>';
  estadoBox.style.display = 'block';
  previewWrap.classList.remove('show');
  acciones.style.display = 'none';
}

async function init(){
  if(!codigoCurso){
    mostrarError('Falta indicar qué curso — vuelve a la lista de certificados y elige uno.');
    return;
  }

  try{
    const res = await fetch(WEB_APP_URL + '?action=getDatosCertificado&dni=' + encodeURIComponent(dni) + '&curso=' + encodeURIComponent(codigoCurso));
    const data = await res.json();

    if(!data.ok){
      mostrarError(data.mensaje || 'Aún no has aprobado el examen de este curso.');
      return;
    }

    const fechaTexto = formatearFechaLarga(data.fecha);
    await renderCertificado(ctx, { nombre: data.nombre, curso: data.curso, fechaTexto });
    datosActuales = { nombre: data.nombre };

    estadoBox.style.display = 'none';
    previewWrap.classList.add('show');
    acciones.style.display = 'block';
  } catch(err){
    mostrarError('No pudimos cargar tu certificado. Intenta de nuevo.');
  }
}

document.getElementById('btnDescargar').addEventListener('click', () => {
  if(!datosActuales) return;
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  const dataUrl = canvas.toDataURL('image/png', 1.0);
  pdf.addImage(dataUrl, 'PNG', 0, 0, 297, 210);
  const nombreArchivo = `Certificado_${codigoCurso}_${datosActuales.nombre.replace(/\s+/g,'_')}.pdf`;
  pdf.save(nombreArchivo);
});

init();
</script>
</body>
</html>
